<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE | $CONTENT_TITLE">TrainoBook</title>
    <!-- 共通CSSの読み込み -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 各ページ個別のCSSやJSが必要な場合のためのフック -->
    <th:block layout:fragment="extra-head"></th:block>
</head>
<body>
    <header>
        <nav class="nav-container">
            <h1><a th:href="@{/book/index}">TrainoBook</a></h1>
            <div class="user-info" th:if="${session.userName != null}">
                <span>ようこそ、<strong th:text="${session.userName}"></strong> さん</span>
                <a th:href="@{/logout}" class="logout-link">ログアウト</a>
            </div>
            <div th:unless="${session.userName != null}">
                 <a th:href="@{/}" class="logout-link">ログイン</a>
            </div>
        </nav>
    </header>

    <div class="container my-5">
        <!-- mainタグ自体に背景色や余白のクラスを付与し、カード風のデザインにします -->
        <main layout:fragment="content" class="p-4 bg-white rounded shadow-sm">
            <!-- 各画面の固有コンテンツがここに挿入される -->
            <p>ここにコンテンツが表示されます。</p>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Trainocate Book Management System</p>
    </footer>

    <!-- Bootstrap Bundle with Popper JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
