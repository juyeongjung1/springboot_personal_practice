<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainoBook</title>
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Bootstrap の Navbar を利用してヘッダーを構築 -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/book/index}">TrainoBook</a>
                <div class="d-flex align-items-center text-white-50 small">
                    <div th:if="${session.userName != null}" class="me-3">
                        <span>ようこそ、<strong class="text-white" th:text="${session.userName}"></strong> さん</span>
                    </div>
                    <a th:if="${session.userName != null}" th:href="@{/logout}" class="btn btn-outline-light btn-sm">ログアウト</a>
                    <a th:unless="${session.userName != null}" th:href="@{/}" class="btn btn-outline-light btn-sm">ログイン</a>
                </div>
            </div>
        </nav>
    </header>

    <div class="container my-5">
        <!-- mainタグ自体に背景色や余白のクラスを付与し、カード風のデザインにします -->
        <main layout:fragment="content" class="p-4 bg-white rounded shadow-sm">
            <!-- 各画面の固有コンテンツがここに挿入される -->
            <p>ここにコンテンツが表示されます。</p>
        </main>
    </div>

    <!-- Bootstrap のユーティリティを利用してフッターを構築 -->
    <footer class="py-4 bg-white border-top text-center text-secondary">
        <div class="container">
            <p class="mb-0">&copy; 2026 Trainocate Book Management System</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
