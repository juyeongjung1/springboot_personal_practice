<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>検索結果</title>
</head>
<body>
	<h1>検索結果</h1>

	<!--
		【課題2.2 - ステップ5】
		Controllerから渡された searchType の値に応じてメッセージを切り替える
	-->
	<div th:if="${searchType == 'title'}">
		キーワード「<span th:text="${keyword}"></span>」での検索結果一覧です。（モック）
	</div>

	<div th:if="${searchType == 'price'}">
		価格が <span th:text="${minPrice}"></span> 円 〜 <span th:text="${maxPrice}"></span> 円 の検索結果一覧です。（モック）
	</div>

	<p>
		<a th:href="@{/book/index}">メニューに戻る</a>
	</p>
</body>
</html>
