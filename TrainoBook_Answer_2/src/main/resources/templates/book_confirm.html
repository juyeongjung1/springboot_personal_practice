<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>登録・更新完了</title>
</head>
<body>
	<h1>登録（または更新）が完了しました！</h1>
	<p>以下の内容で保存処理を受け付けました。</p>
	
	<h3>保存内容</h3>
	<ul>
		<li><strong>書籍名：</strong> <span th:text="${bookForm.title}"></span></li>
		<li><strong>著者名：</strong> <span th:text="${bookForm.author}"></span></li>
		<li><strong>価格：</strong> <span th:text="${bookForm.price}"></span> 円</li>
	</ul>
	
	<p>
		<a th:href="@{/book/index}">メニューに戻る</a>
	</p>
</body>
</html>
