<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍管理メニュー</title>
<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
	<h1 class="mb-4">書籍管理メニュー</h1>
	<hr>

	<!--
		【課題2.2 - ステップ2】
		メニューへのリンクを配置する。
		Thymeleafのリンク記法「th:href="@{URL}"」を使用する（5章参照）。
	-->
	<div class="mb-4">
		<h4>メニュー</h4>
		<ul class="list-group">
			<li class="list-group-item">
				<a th:href="@{/book/list}">全書籍リストの確認</a>
			</li>
			<li class="list-group-item">
				<a th:href="@{/book/form}">書籍情報の登録</a>
			</li>
		</ul>
	</div>

	<hr>

	<!--
		【課題2.2 - ステップ4】
		① 書籍名検索フォーム（GETメソッド）
		・入力項目: keyword（テキストボックス）
		・送信先: /book/search/title
	-->
	<div class="mb-4">
		<h4>書籍名で検索</h4>
		<form action="/book/search/title" method="get" class="row g-3">
			<div class="col-auto">
				<input type="text" class="form-control" name="keyword" placeholder="キーワードを入力">
			</div>
			<div class="col-auto">
				<button type="submit" class="btn btn-outline-primary">タイトルで検索</button>
			</div>
		</form>
	</div>

	<!--
		【課題2.2 - ステップ4】
		② 価格検索フォーム（GETメソッド）
		・入力項目: minPrice（最低価格）, maxPrice（最高価格）
		・送信先: /book/search/price
	-->
	<div class="mb-4">
		<h4>価格帯で検索</h4>
		<form action="/book/search/price" method="get" class="row g-3 align-items-center">
			<div class="col-auto">
				<input type="number" class="form-control" name="minPrice" placeholder="最低価格">
			</div>
			<div class="col-auto">
				<span>〜</span>
			</div>
			<div class="col-auto">
				<input type="number" class="form-control" name="maxPrice" placeholder="最高価格">
			</div>
			<div class="col-auto">
				<button type="submit" class="btn btn-outline-primary">価格帯で検索</button>
			</div>
		</form>
	</div>

</div>
<!-- Bootstrap JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
