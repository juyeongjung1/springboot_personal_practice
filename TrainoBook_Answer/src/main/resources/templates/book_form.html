<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍情報の登録</title>
<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
	<div class="row justify-content-center">
		<div class="col-md-8">
			<h1 class="mb-4">書籍情報の登録</h1>
			<div class="card shadow-sm">
				<div class="card-header bg-primary text-white">
					<h5 class="mb-0">書籍情報を入力してください。</h5>
				</div>
				<div class="card-body mt-3">
					<!-- 【課題4.1追加】 th:object="${bookForm}" を追加 -->
					<form th:action="@{/book/register}" method="post" th:object="${bookForm}">
						
						<!--
							==============================================================
							【課題2.3の解答】以下の3項目（title, author, price）を作成しました
							（第4章で th:field による記述に置き換えています）
							==============================================================
							[以前のコード]
							<div class="mb-3">
								<label for="title" class="form-label fw-bold">書籍名</label>
								<input type="text" class="form-control" id="title" name="title" required>
							</div>
						-->
						
						<div class="mb-3">
							<label for="title" class="form-label fw-bold">書籍名</label>
							<!-- 【課題4.1追加】 th:field を用いたバインドとエラー表示 -->
							<input type="text" class="form-control" id="title" th:field="*{title}">
							<div th:errors="*{title}" class="text-danger mt-1 small"></div>
						</div>
						<div class="mb-3">
							<label for="author" class="form-label fw-bold">著者名</label>
							<input type="text" class="form-control" id="author" th:field="*{author}">
							<div th:errors="*{author}" class="text-danger mt-1 small"></div>
						</div>
						<div class="mb-3">
							<label for="price" class="form-label fw-bold">価格（円）</label>
							<input type="number" class="form-control" id="price" th:field="*{price}">
							<div th:errors="*{price}" class="text-danger mt-1 small"></div>
						</div>
						
						<!--
							==============================================================
							【課題3.6の解答】ジャンルID入力を追加しました
							（第4章で th:field による記述に置き換えています）
							==============================================================
							[以前のコード]
							<div class="mb-4">
								<label for="genreId" class="form-label fw-bold">ジャンルID</label>
								<input type="number" class="form-control" id="genreId" name="genreId" required>
								<div class="form-text text-danger mt-1">
									（参考）ジャンルID一覧： 1=プログラミング, 2=ビジネス, 3=小説, 4=科学, 5=自己啓発
								</div>
							</div>
						-->
						<div class="mb-4">
							<label for="genreId" class="form-label fw-bold">ジャンルID</label>
							<input type="number" class="form-control" id="genreId" th:field="*{genreId}">
							<div th:errors="*{genreId}" class="text-danger mt-1 small"></div>
							<div class="form-text text-muted mt-1">
								（参考）ジャンルID一覧： 1=プログラミング, 2=ビジネス, 3=小説, 4=科学, 5=自己啓発
							</div>
						</div>
						
						<div class="d-flex justify-content-between mt-4">
							<a th:href="@{/book/index}" class="btn btn-secondary px-4">戻る</a>
							<button type="submit" class="btn btn-primary px-4">登録する</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- Bootstrap JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
