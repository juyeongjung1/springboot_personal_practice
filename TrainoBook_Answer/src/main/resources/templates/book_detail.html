<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍詳細</title>
<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
	<div class="row justify-content-center">
		<div class="col-md-8">
			<h1 class="mb-4">書籍詳細</h1>

			<div class="card shadow-sm mb-4">
				<div class="card-header bg-secondary text-white">
					<h5 class="mb-0">登録情報</h5>
				</div>
				<div class="card-body">
					<table class="table table-bordered mb-0">
						<tbody>
							<tr>
								<th class="bg-light" style="width: 30%">ID</th>
								<td th:text="${book.id}"></td>
							</tr>
							<tr>
								<th class="bg-light">書籍名</th>
								<td th:text="${book.title}"></td>
							</tr>
							<tr>
								<th class="bg-light">著者名</th>
								<td th:text="${book.author}"></td>
							</tr>
							<tr>
								<th class="bg-light">価格</th>
								<td th:text="${book.price} + ' 円'"></td>
							</tr>
							<tr>
								<th class="bg-light">ジャンル名</th>
								<td th:text="${book.genre != null ? book.genre.name : '（未設定）'}"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div class="d-flex justify-content-between">
				<a th:href="@{/book/list}" class="btn btn-secondary px-4">一覧に戻る</a>
				
				<div class="d-flex gap-2">
					<!-- 更新画面への遷移（GET） -->
					<form th:action="@{/book/update/} + ${book.id}" method="get">
						<button type="submit" class="btn btn-primary px-4">更新</button>
					</form>
					
					<!-- 削除処理の実行（POST推奨だがGET等でも可） -->
					<form th:action="@{/book/delete/} + ${book.id}" method="post" onsubmit="return confirm('本当に削除してよろしいですか？');">
						<button type="submit" class="btn btn-danger px-4">削除</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- Bootstrap JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
