<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍情報の更新</title>
<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
	<div class="row justify-content-center">
		<div class="col-md-8">
			<h1 class="mb-4">書籍情報の更新</h1>
			<div class="card shadow-sm">
				<div class="card-header bg-success text-white">
					<h5 class="mb-0">変更内容を入力してください。</h5>
				</div>
				<div class="card-body mt-3">
					<!--
						【課題3.7の解答】
						送信先（action）: /book/update/{id} (POST)
						
						【課題4.1の解答】 th:object="${bookForm}" を用いる
					-->
					<form th:action="@{/book/update/} + ${bookForm.id}" method="post" th:object="${bookForm}">
						
						<div class="mb-3">
							<label class="form-label fw-bold">ID（変更不可）</label>
							<!-- th:fieldを使用してもよいが、disabledなので値渡しのみ -->
							<input type="text" class="form-control" th:field="*{id}" disabled>
						</div>
						
						<div class="mb-3">
							<label for="title" class="form-label fw-bold">書籍名</label>
							<input type="text" class="form-control" id="title" th:field="*{title}">
							<div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger mt-1 small"></div>
						</div>
						<div class="mb-3">
							<label for="author" class="form-label fw-bold">著者名</label>
							<input type="text" class="form-control" id="author" th:field="*{author}">
							<div th:if="${#fields.hasErrors('author')}" th:errors="*{author}" class="text-danger mt-1 small"></div>
						</div>
						<div class="mb-3">
							<label for="price" class="form-label fw-bold">価格（円）</label>
							<input type="number" class="form-control" id="price" th:field="*{price}">
							<div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger mt-1 small"></div>
						</div>
						
						<!-- ジャンルID入力（第3章用） -->
						<div class="mb-4">
							<label for="genreId" class="form-label fw-bold">ジャンルID</label>
							<input type="number" class="form-control" id="genreId" th:field="*{genreId}">
							<div th:if="${#fields.hasErrors('genreId')}" th:errors="*{genreId}" class="text-danger mt-1 small"></div>
							<div class="form-text text-muted mt-1">
								（参考）ジャンルID一覧： 1=プログラミング, 2=ビジネス, 3=小説, 4=科学, 5=自己啓発
							</div>
						</div>
						
						<div class="d-flex justify-content-between mt-4">
							<a th:href="@{/book/detail/} + ${bookForm.id}" class="btn btn-secondary px-4">詳細に戻る</a>
							<button type="submit" class="btn btn-success px-4">更新する</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- Bootstrap JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
