<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍一覧</title>
<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
	<h1 class="mb-4">書籍一覧</h1>

	<!--
		【課題3.4】DBから取得した書籍一覧を表示
	-->
	<table class="table table-striped table-hover border">
		<thead class="table-dark">
			<tr>
				<th>ID</th>
				<th>書籍名</th>
				<th>著者名</th>
				<th>価格</th>
				<th>ジャンル名</th>
			</tr>
		</thead>
		<tbody>
			<!-- コントローラーから渡された books リストをループして表示 -->
			<tr th:each="book : ${books}">
				<td th:text="${book.id}"></td>
				<td>
					<!-- 動的URL： 書籍詳細へのリンク -->
					<a th:href="@{/book/detail/} + ${book.id}" th:text="${book.title}"></a>
				</td>
				<td th:text="${book.author}"></td>
				<td th:text="${book.price} + ' 円'"></td>
				<!-- ジャンル名はbookエンティティからgenreを辿って取得 -->
				<td th:text="${book.genre != null ? book.genre.name : '不明'}"></td>
			</tr>
		</tbody>
	</table>

	<a th:href="@{/book/index}" class="btn btn-secondary mt-3">メニューに戻る</a>
</div>
<!-- Bootstrap JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
