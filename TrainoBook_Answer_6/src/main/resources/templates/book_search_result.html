<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>検索結果</title>
</head>
<body>
    <main layout:fragment="content">
        <h2>検索結果</h2>

        <!-- 検索条件の表示 -->
        <div style="margin-bottom: 2rem; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem;">
            検索条件：
            タイトル『<span th:text="${keyword}"></span>』 / 
            ジャンル『<span th:text="${genreName}"></span>』 / 
            価格帯『<span th:text="${minPrice}"></span>』〜『<span th:text="${maxPrice}"></span>』円
        </div>

        <table th:if="${!#lists.isEmpty(books)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>書籍名</th>
                    <th>著者名</th>
                    <th>価格</th>
                    <th>ジャンル名</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td>
                        <a th:href="@{/book/detail/} + ${book.id}" th:text="${book.title}"></a>
                    </td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.price} + ' 円'"></td>
                    <td th:text="${book.genre != null ? book.genre.name : '不明'}"></td>
                </tr>
            </tbody>
        </table>

        <!-- 0件ケアの表示 -->
        <div th:if="${#lists.isEmpty(books)}" style="padding: 1rem; background-color: #fffbeb; color: #92400e; border-radius: 0.5rem; margin-bottom: 1.5rem;">
            該当する書籍は見つかりませんでした。
        </div>

        <div style="margin-top: 2rem;">
            <a th:href="@{/book/index}">メニューに戻る</a>
        </div>
    </main>
</body>
</html>
