<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE | $CONTENT_TITLE">TrainoBook</title>
    <!-- 共通CSSの読み込み -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- 各ページ個別のCSSやJSが必要な場合のためのフック -->
    <th:block layout:fragment="extra-head"></th:block>
</head>
<body>
    <header>
        <nav class="nav-container">
            <h1><a th:href="@{/book/index}">TrainoBook</a></h1>
            <div class="user-info" th:if="${session.userName != null}">
                <span>ようこそ、<strong th:text="${session.userName}"></strong> さん</span>
                <a th:href="@{/logout}" class="logout-link">ログアウト</a>
            </div>
            <div th:unless="${session.userName != null}">
                 <a th:href="@{/}" class="logout-link">ログイン</a>
            </div>
        </nav>
    </header>

    <main layout:fragment="content">
        <!-- 各画面の固有コンテンツがここに挿入される -->
        <p>ここにコンテンツが表示されます。</p>
    </main>

    <footer>
        <p>&copy; 2026 Trainocate Book Management System</p>
    </footer>
</body>
</html>
