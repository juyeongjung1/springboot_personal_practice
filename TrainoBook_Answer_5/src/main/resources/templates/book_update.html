<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>書籍情報の更新</title>
</head>
<body>
    <main layout:fragment="content">
        <h1>書籍情報の更新</h1>
        <p>変更内容を入力してください。</p>

        <!-- 【課題4.1の解答】 th:object="${bookForm}" を用いる -->
        <form th:action="@{/book/update/} + ${bookForm.id}" method="post" th:object="${bookForm}">
            
            <div>
                <label>ID（変更不可）</label>
                <input type="text" th:field="*{id}" disabled>
            </div>
            
            <div>
                <label for="title">書籍名</label>
                <input type="text" id="title" th:field="*{title}">
                <div th:errors="*{title}" class="error-msg"></div>
            </div>
            
            <div>
                <label for="author">著者名</label>
                <input type="text" id="author" th:field="*{author}">
                <div th:errors="*{author}" class="error-msg"></div>
            </div>
            
            <div>
                <label for="price">価格（円）</label>
                <input type="number" id="price" th:field="*{price}">
                <div th:errors="*{price}" class="error-msg"></div>
            </div>
            
            <div>
                <label for="genreId">ジャンルID</label>
                <input type="number" id="genreId" th:field="*{genreId}">
                <div th:errors="*{genreId}" class="error-msg"></div>
                <p>
                    （参考）ジャンルID一覧： 1=プログラミング, 2=ビジネス, 3=小説, 4=科学, 5=自己啓発
                </p>
            </div>
            
            <div>
                <a th:href="@{/book/detail/} + ${bookForm.id}">詳細に戻る</a>
                <button type="submit">更新する</button>
            </div>
        </form>
    </main>
</body>
</html>
