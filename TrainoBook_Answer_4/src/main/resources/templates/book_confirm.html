<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>登録・更新完了</title>
</head>
<body>
	<h1>処理完了</h1>
	<p>以下の内容で書籍データを保存しました。</p>

	<!--
		==============================================================
		【課題3.6の解答（DB対応）】DBに保存されたBookエンティティを表示しています
		==============================================================
	-->
	<table border="1">
		<tbody>
			<tr>
				<th>ID</th>
				<td th:text="${book.id}"></td>
			</tr>
			<tr>
				<th>書籍名</th>
				<td th:text="${book.title}"></td>
			</tr>
			<tr>
				<th>著者名</th>
				<td th:text="${book.author}"></td>
			</tr>
			<tr>
				<th>価格</th>
				<td th:text="${book.price} + ' 円'"></td>
			</tr>
			<tr>
				<th>ジャンルID</th>
				<td th:text="${book.genreId}"></td>
			</tr>
		</tbody>
	</table>

	<p>
		<a th:href="@{/book/index}">メニューに戻る</a>
	</p>
</body>
</html>
