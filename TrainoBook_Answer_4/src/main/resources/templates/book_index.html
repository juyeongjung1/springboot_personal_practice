<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍管理メニュー</title>
</head>
<body>
	<!-- 【課題4.3追加】 セッション情報の表示とログアウト -->
	<div>
		<h1>書籍管理メニュー</h1>
		<div>
			<span th:if="${session.userName != null}">
				ようこそ、<span th:text="${session.userName}"></span> さん
			</span>
			<a th:href="@{/logout}">ログアウト</a>
		</div>
	</div>
	<hr>

	<!--
		【課題2.2 - ステップ2】
		メニューへのリンクを配置する。
		Thymeleafのリンク記法「th:href="@{URL}"」を使用する（5章参照）。
	-->
	<div>
		<h3>メニュー</h3>
		<ul>
			<li>
				<a th:href="@{/book/list}">全書籍リストの確認</a>
			</li>
			<li>
				<a th:href="@{/book/form}">書籍情報の登録</a>
			</li>
		</ul>
	</div>

	<hr>

	<!--
		【課題2.2 - ステップ4】
		① 書籍名検索フォーム（GETメソッド）
		・入力項目: keyword（テキストボックス）
		・送信先: /book/search/title
	-->
	<div>
		<h3>書籍名で検索</h3>
		<form th:action="@{/book/search/title}" method="get">
			<input type="text" name="keyword" placeholder="キーワードを入力">
			<button type="submit">タイトルで検索</button>
		</form>
	</div>

	<!--
		【課題2.2 - ステップ4】
		② 価格検索フォーム（GETメソッド）
		・入力項目: minPrice（最低価格）, maxPrice（最高価格）
		・送信先: /book/search/price
	-->
	<div>
		<h3>価格帯で検索</h3>
		<form th:action="@{/book/search/price}" method="get">
			<input type="number" name="minPrice" placeholder="最低価格">
			〜
			<input type="number" name="maxPrice" placeholder="最高価格">
			<button type="submit">価格帯で検索</button>
		</form>
	</div>
</body>
</html>
