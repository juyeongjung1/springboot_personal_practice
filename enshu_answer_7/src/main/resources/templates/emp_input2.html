<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">

<div layout:fragment="main_content">

    <h2 class="text-success border-bottom pb-2 mb-3">社員登録</h2>
    <form th:action="@{/insertEmp}" method="post" class="mx-auto w-50">

        <!-- 7.5-c 正解-->
        <div class="mb-3">
            <label for="name" class="form-label">社員名</label>
            <input type="text" id="name" name="name" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">パスワード</label>
            <input type="password" id="password" name="password" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="salary" class="form-label">給与</label>
            <input type="number" id="salary" name="salary" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">勤務地</label>
            <select name="locationId" class="form-select" required>
                <option value="">選択してください</option>
                <option th:each="loc : ${locations}" th:text="${loc.name}" th:value="${loc.id}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">登録</button>
    </form>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
