<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <title>人事管理システム</title>
</head>


<body class="bg-light p-4">
    <div class="container">
        <h1 class="text-primary fw-bold mb-4 border-bottom">人事管理システム</h1>

        <div class="row">
            <!-- 左：メニューと検索フォーム -->
            <div class="col-md-3">
                <h4 class="text-secondary">メニュー</h4>
                <ul class="mb-4 ps-0" style="list-style: none;">
                    <li><a th:href="@{/3}" class="btn btn-outline-primary w-100 mb-2">全社員一覧</a></li>
                    <li><a th:href="@{/showSearchForm}" class="btn btn-outline-primary w-100 mb-2">詳細検索</a></li>
                    <li><a th:href="@{/showInputView}" class="btn btn-outline-primary w-100">社員データ登録</a></li>
                </ul>

                <h5>社員番号で検索</h5>
                <!-- 7.5-b 正解-->
                <form th:action="@{/showFindById}" method="get">
					<div class="input-group mb-3">
                    	<input type="number" name="id" placeholder="社員番号" class="form-control">
                    	<button class="btn btn-primary" type="submit">検索</button>
					</div>
                </form>
            </div><!--END col-md-3(サイドバー) end-->

            <!-- 右：メイン画面 -->
            <div class="col-md-9">
                <h2 class="text-success border-bottom pb-2 mb-3">社員登録</h2>
                <form th:action="@{/insertEmp}" method="post" class="mx-auto w-50">
					
                   <!-- 7.5-c 正解-->
                    <div class="mb-3">
                        <label for="name" class="form-label">社員名</label>
                        <input type="text" id="name" name="name" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">パスワード</label>
                        <input type="password" id="password" name="password" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label for="salary" class="form-label">給与</label>
                        <input type="number" id="salary" name="salary" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">勤務地</label>
                        <select name="locationId" class="form-select" required>
                            <option value="">選択してください</option>
                            <option th:each="loc : ${locations}" th:text="${loc.name}" th:value="${loc.id}">
                            </option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success">登録</button>
                </form>
            </div><!--END col-md-3(メイン画面)-->
        </div><!--END row1 end-->
    </div><!--END container end-->

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
