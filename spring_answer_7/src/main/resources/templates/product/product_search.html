<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品検索</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>

<!-- ヘッダー -->
<div class="container-fluid bg-primary text-white text-center py-3">
    <h1>商品検索</h1>
</div> <!-- END header -->

<!-- 検索フォーム -->
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form th:action="@{/product/search}" method="GET" class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">商品名</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="商品名を入力">
                </div>
                <div class="col-md-6">
                    <label for="price" class="form-label">価格</label>
                    <input type="number" id="price" name="price" class="form-control" placeholder="価格を入力">
                </div>
                <div class="col-12 text-center mt-3">
                    <button type="submit" class="btn btn-primary">検索</button>
                </div>
            </form>
        </div>
    </div>
</div> <!-- END search form -->


<!-- フッター -->
<div class="container-fluid bg-dark text-white text-center py-3">
    <p>© 2024 商品検索システム</p>
</div> <!-- END footer -->

<!-- Bootstrap JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
