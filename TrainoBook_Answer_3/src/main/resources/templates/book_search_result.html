<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>検索結果</title>
</head>
<body>
	<h1>検索結果</h1>

	<!-- 検索条件の表示 -->
	<div>
		検索条件：
		タイトル『<span th:text="${keyword}"></span>』 / 
		価格『<span th:text="${minPrice}"></span>』〜『<span th:text="${maxPrice}"></span>』
	</div>

	<!--
		==============================================================
		【課題3.4の解答（DB対応）】検索結果一覧
		==============================================================
	-->
	<table border="1">
		<thead>
			<tr>
				<th>ID</th>
				<th>書籍名</th>
				<th>著者名</th>
				<th>価格</th>
				<th>ジャンル名</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="book : ${books}">
				<td th:text="${book.id}"></td>
				<td>
					<a th:href="@{/book/detail/} + ${book.id}" th:text="${book.title}"></a>
				</td>
				<td th:text="${book.author}"></td>
				<td th:text="${book.price} + ' 円'"></td>
				<td th:text="${book.genre != null ? book.genre.name : '不明'}"></td>
			</tr>
		</tbody>
	</table>

	<p>
		<a th:href="@{/book/index}">メニューに戻る</a>
	</p>
</body>
</html>
