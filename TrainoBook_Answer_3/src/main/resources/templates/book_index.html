<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍管理メニュー</title>
</head>
<body>
	<h1>書籍管理メニュー</h1>
	<hr>

	<!--
		【課題2.2 - ステップ2】
	-->
	<div>
		<h3>メニュー</h3>
		<ul>
			<li>
				<a th:href="@{/book/list}">全書籍リストの確認</a>
			</li>
			<li>
				<a th:href="@{/book/form}">書籍情報の登録</a>
			</li>
		</ul>
	</div>

	<hr>

	<!--
		【課題2.2 - ステップ4】
	-->
	<div>
		<h3>書籍名で検索</h3>
		<form action="/book/search/title" method="get">
			<input type="text" name="keyword" placeholder="キーワードを入力">
			<button type="submit">タイトルで検索</button>
		</form>
	</div>

	<!--
		【課題2.2 - ステップ4】
	-->
	<div>
		<h3>価格帯で検索</h3>
		<form action="/book/search/price" method="get">
			<input type="number" name="minPrice" placeholder="最低価格">
			〜
			<input type="number" name="maxPrice" placeholder="最高価格">
			<button type="submit">価格帯で検索</button>
		</form>
	</div>
</body>
</html>
