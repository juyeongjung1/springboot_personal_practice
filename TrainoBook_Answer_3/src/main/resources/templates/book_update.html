<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍情報の更新</title>
</head>
<body>
	<h1>書籍情報の更新</h1>
	<p>変更内容を入力してください。</p>
	<!--
		【課題3.7の解答】
		送信先（action）: /book/update/{id} (POST)
	-->
	<form th:action="@{/book/update/} + ${book.id}" method="post">
		
		<div>
			<label>ID（変更不可）</label>
			<input type="text" th:value="${book.id}" disabled>
		</div>
		
		<div>
			<label for="title">書籍名</label>
			<input type="text" id="title" name="title" th:value="${book.title}" required>
		</div>
		<div>
			<label for="author">著者名</label>
			<input type="text" id="author" name="author" th:value="${book.author}" required>
		</div>
		<div>
			<label for="price">価格（円）</label>
			<input type="number" id="price" name="price" th:value="${book.price}" required>
		</div>
		
		<!-- ジャンルID入力（第3章用） -->
		<div>
			<label for="genreId">ジャンルID</label>
			<input type="number" id="genreId" name="genreId" th:value="${book.genreId}" required>
			<p>
				（参考）ジャンルID一覧： 1=プログラミング, 2=ビジネス, 3=小説, 4=科学, 5=自己啓発
			</p>
		</div>
		
		<div>
			<a th:href="@{/book/detail/} + ${book.id}">詳細に戻る</a>
			<button type="submit">更新する</button>
		</div>
	</form>
</body>
</html>
