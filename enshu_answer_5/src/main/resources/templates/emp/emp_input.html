<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
 xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
       layout:decorate="~{/layout}">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>人事管理システム</title>
	<link rel="stylesheet" th:href="@{/css/main_style.css}" />
</head>
<body>
	<main layout:fragment="main_content">
	<h1>社員登録</h1>

	<form th:action = "@{/emp/insertEmp}" method = "post" th:object = "${empForm2}">
		<table>
			<tr>
				<td>社員名</td>
				<td><input type = "text" name = "name">
				<span th:errors="*{name}"></span></td>
			</tr>
			<tr>
				<td>パスワード</td>
				<td><input type = "password" name = "password">
				<span th:errors="*{password}"></span></td>
			</tr>
			<tr>
				<td>給与</td>
				<td><input type = "number" name = "salary">
				<span th:errors="*{salary}"></span></td></td>
			</tr>
		</table>
		<input type = "submit" value = "登録">
	</form>
	
</main>
</body>

</html>
