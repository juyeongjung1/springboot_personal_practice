<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Insert title here</title>
</head>

<body>
	<p th:text="${session.userData.empName}" style="margin-left:90%"></p>
	<hr>
	<h1>検索</h1>
	<h2>ID検索</h2>
	<form th:action="@{/product/findById}">
		商品番号：<input type="text" name="id" />
		<input type="submit" value="検索">
	</form>
	
	<h2>商品価格検索</h2>
	<form th:action="@{/product/findByPrice}">
		商品価格：<input type="text" name="price" />
		<input type="submit" value="検索">
	</form>
	
	<h2>商品名+価格の検索</h2>
	<form th:action="@{/product/findByNameAndPrice}">
		商品名：<input type="text" name="name" />
		商品価格：<input type="text" name="price" />
		<input type="submit" value="検索">
	</form>
	
</body>

</html>
