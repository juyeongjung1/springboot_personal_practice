<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>2章 ログインサンプル1</title>
</head>

<body>
<h1>ログイン画面</h1>

<form th:action="@{/login4}" method="post" th:object="${userForm}">
		
<p>社員番号　：<input type = "text" th:field="*{empId}"/>
			<span th:errors="*{empId}"></span></p>
	
<p>パスワード：<input type="password" th:field="*{password}" />
			<span th:errors="*{password}"></span></p>
			
<input type="submit" value="ログイン">

</form>
</body>

</html>
