spring.thymeleaf.cache=false

# MySQLのデータベース接続設定
spring.datasource.url=jdbc:mysql://localhost/spring_exercise?serverTimezone=Asia/Tokyo
spring.datasource.username=spring_exercise_user
spring.datasource.password=password

# JPA/Hibernateの追加設定（必要に応じて）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
